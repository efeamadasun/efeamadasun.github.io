<script>
(function () {
  var quotes = [
    { text: "The impediment to action advances action. What stands in the way becomes the way.", author: "Marcus Aurelius" },
    { text: "Waste no more time arguing what a good man should be. Be one.", author: "Marcus Aurelius" },
    { text: "You have power over your mind — not outside events. Realize this, and you will find strength.", author: "Marcus Aurelius" },
    { text: "If it is not right, do not do it; if it is not true, do not say it.", author: "Marcus Aurelius" },
    { text: "We suffer more often in imagination than in reality.", author: "Seneca" },
    { text: "Luck is what happens when preparation meets opportunity.", author: "Seneca" },
    { text: "No man was ever wise by chance.", author: "Seneca" },
    { text: "If a man knows not to which port he sails, no wind is favorable.", author: "Seneca" },
    { text: "It is not things themselves that disturb us, but our opinions about things.", author: "Epictetus" },
    { text: "First say to yourself what you would be; and then do what you have to do.", author: "Epictetus" },
    { text: "No man is free who is not master of himself.", author: "Epictetus" },
    { text: "He who has a why to live can bear almost any how.", author: "Friedrich Nietzsche" },
    { text: "The unexamined life is not worth living.", author: "Socrates" },
    { text: "I know that I know nothing.", author: "Socrates" },
    { text: "Knowing yourself is the beginning of all wisdom.", author: "Aristotle" },
    { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Will Durant" },
    { text: "The roots of education are bitter, but the fruit is sweet.", author: "Aristotle" },
    { text: "The beginning is the most important part of the work.", author: "Plato" },
    { text: "Necessity is the mother of invention.", author: "Plato" },
    { text: "Study the past if you would define the future.", author: "Confucius" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "The man who moves a mountain begins by carrying away small stones.", author: "Confucius" },
    { text: "A journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "The flame that burns twice as bright burns half as long.", author: "Lao Tzu" },
    { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
    { text: "Learning never exhausts the mind.", author: "Leonardo da Vinci" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Education is the most powerful weapon which you can use to change the world.", author: "Nelson Mandela" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "If you can dream it, you can do it.", author: "Walt Disney" },
    { text: "Whatever you are, be a good one.", author: "Abraham Lincoln" },
    { text: "Give me six hours to chop down a tree and I will spend the first four sharpening the axe.", author: "Abraham Lincoln" },
    { text: "Well done is better than well said.", author: "Benjamin Franklin" },
    { text: "An investment in knowledge pays the best interest.", author: "Benjamin Franklin" },
    { text: "Lost time is never found again.", author: "Benjamin Franklin" },
    { text: "Genius is one percent inspiration and ninety-nine percent perspiration.", author: "Thomas Edison" },
    { text: "I have not failed. I've just found 10,000 ways that won't work.", author: "Thomas Edison" },
    { text: "If I have seen further it is by standing on the shoulders of Giants.", author: "Isaac Newton" },
    { text: "What we know is a drop, what we don't know is an ocean.", author: "Isaac Newton" },
    { text: "Nothing in life is to be feared, it is only to be understood.", author: "Marie Curie" },
    { text: "Be less curious about people and more curious about ideas.", author: "Marie Curie" },
    { text: "I never dreamed about success. I worked for it.", author: "Estee Lauder" },
    { text: "The future depends on what you do today.", author: "Mahatma Gandhi" },
    { text: "Be the change that you wish to see in the world.", author: "Mahatma Gandhi" },
    { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "Imagination is more important than knowledge.", author: "Albert Einstein" },
    { text: "Life is like riding a bicycle. To keep your balance you must keep moving.", author: "Albert Einstein" },
    { text: "The important thing is not to stop questioning.", author: "Albert Einstein" },
    { text: "The only thing we have to fear is fear itself.", author: "Franklin D. Roosevelt" },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "It is hard to fail, but it is worse never to have tried to succeed.", author: "Theodore Roosevelt" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "If you're going through hell, keep going.", author: "Winston Churchill" },
    { text: "To improve is to change; to be perfect is to change often.", author: "Winston Churchill" },
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "Continuous improvement is better than delayed perfection.", author: "Mark Twain" },
    { text: "The price of anything is the amount of life you exchange for it.", author: "Henry David Thoreau" },
    { text: "What you do speaks so loudly that I cannot hear what you say.", author: "Ralph Waldo Emerson" },
    { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" }
  ];

  function quoteForToday() {
    var start = new Date(new Date().getFullYear(), 0, 0);
    var diff = new Date() - start;
    var day = Math.floor(diff / 86400000);
    return quotes[day % quotes.length];
  }

  var shownQuoteIndexes = [];
  var currentQuoteIndex = null;

  function quoteIndex(quote) {
    return quotes.indexOf(quote);
  }

  function rememberQuote(quote) {
    var index = quoteIndex(quote);

    if (index === -1 || shownQuoteIndexes.indexOf(index) !== -1) {
      return;
    }

    shownQuoteIndexes.push(index);
  }

  function setQuote(quote) {
    var text = document.getElementById("quote-text");
    var author = document.getElementById("quote-author");

    if (!text || !author) {
      return;
    }

    text.textContent = quote.text;
    author.textContent = "— " + quote.author;
    currentQuoteIndex = quoteIndex(quote);
  }

  function randomUnshownQuote() {
    var availableIndexes = quotes
      .map(function (_, index) { return index; })
      .filter(function (index) { return shownQuoteIndexes.indexOf(index) === -1; });

    if (!availableIndexes.length) {
      shownQuoteIndexes = currentQuoteIndex === null ? [] : [currentQuoteIndex];
      availableIndexes = quotes
        .map(function (_, index) { return index; })
        .filter(function (index) { return index !== currentQuoteIndex; });
    }

    return quotes[availableIndexes[Math.floor(Math.random() * availableIndexes.length)]];
  }

  var todayQuote = quoteForToday();
  setQuote(todayQuote);
  rememberQuote(todayQuote);

  var button = document.getElementById("new-quote");
  if (button) {
    button.addEventListener("click", function () {
      var quote = randomUnshownQuote();
      setQuote(quote);
      rememberQuote(quote);
    });
  }
}());
</script>
